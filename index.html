<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>เทียบราคาวัสดุก่อนออก PO</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;600;700&display=swap">
<style>
:root{--bg:#f1f2f8;--card:#fff;--ink:#1d1d22;--mute:#6b6c78;--yellow:#ffdf9e;--green:#bfe5c6;--greenink:#14532d;--lav:#e6e6fb;--cream:#fff4de;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#15161c;--card:#1f2028;--ink:#f0f0f5;--mute:#a0a1ad;--yellow:#7a5f1e;--green:#1f5a36;--greenink:#c8f2d2;--lav:#2b2c45;--cream:#3a3220}}
:root[data-theme="dark"]{--bg:#15161c;--card:#1f2028;--ink:#f0f0f5;--mute:#a0a1ad;--yellow:#7a5f1e;--green:#1f5a36;--greenink:#c8f2d2;--lav:#2b2c45;--cream:#3a3220}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Sarabun",system-ui,sans-serif;font-size:17px;line-height:1.45}
main{max-width:520px;margin:0 auto;padding:20px 16px 60px}
h1{font-size:1.5rem;margin:0 0 2px}
.sub{margin:0 0 18px;color:var(--mute);font-size:.95rem}
h2{font-size:1rem;margin:0 0 10px}
.card{background:var(--card);border:2px solid var(--ink);border-radius:18px;margin-bottom:16px;overflow:hidden}
.pad{padding:14px}
input{font:inherit;color:inherit;background:transparent;border:2px solid var(--ink);border-radius:12px;padding:9px 10px;width:100%;min-width:0}
input:focus-visible,button:focus-visible{outline:3px solid #7c83ff;outline-offset:2px}
.stores{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stores input{font-weight:700;text-align:center;padding:8px 4px}
.stores input{background:var(--yellow)}
.name{font-weight:700;font-size:1.05rem}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:8px 0 12px}
.lbl{font-size:.8rem;color:var(--mute);display:block;margin:0 0 2px 4px}
.line{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.line .sn{flex:1;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.line input{width:130px;text-align:right;font-size:1.1rem;font-weight:600}
.line.best input{background:var(--green);color:var(--greenink);font-weight:700}
.tag{display:none;font-size:.75rem;font-weight:700;background:var(--green);color:var(--greenink);border:2px solid var(--ink);border-radius:20px;padding:0 8px}
.line.best .tag{display:inline-block}
.foot{display:flex;justify-content:space-between;align-items:center;background:var(--lav);border-top:2px solid var(--ink);padding:10px 14px;font-weight:600}
.foot button{background:none;border:none;color:var(--mute);font:inherit;cursor:pointer;padding:4px 6px}
.big{width:100%;font:inherit;font-weight:700;font-size:1.1rem;background:var(--yellow);color:var(--ink);border:2px solid var(--ink);border-radius:16px;padding:14px;cursor:pointer;margin-bottom:12px}
.chips{display:flex;gap:8px;margin-bottom:18px}
.chip{font:inherit;font-weight:600;font-size:.9rem;background:var(--card);color:var(--ink);border:2px solid var(--ink);border-radius:20px;padding:6px 14px;cursor:pointer}
.rank{background:var(--card)}
.rk{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:2px solid var(--ink)}
.rk:last-of-type{border-bottom:none}
.rk small{display:block;color:var(--mute);font-weight:400}
.rk b{font-size:1.1rem}
.it{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 0;border-bottom:2px solid var(--ink)}
.it small{display:block;color:var(--mute)}
.it .r{text-align:right}
.it .r b{margin-left:6px}
.win{background:var(--green);color:var(--greenink);border:2px solid var(--ink);border-radius:14px;padding:12px 14px;margin-top:10px}
.win b{font-size:1.3rem}
.win small{display:block}
.sav{background:var(--yellow);color:var(--ink);margin-top:8px}
.empty{color:var(--mute)}
@media print{.chips,.big,.foot button,.noprint{display:none}body{background:#fff}}
</style>
</head>
<body>
<main>
<h1>เทียบราคาวัสดุก่อนออก PO</h1>
<p class="sub">ใส่ราคาแต่ละร้าน แล้วดูว่าร้านไหนถูกสุด</p>

<div class="chips noprint">
<button class="chip" id="print">พิมพ์ / PDF</button>
<button class="chip" id="clear">ล้างราคา</button>
</div>

<div class="card pad">
<h2>1. ชื่อร้าน</h2>
<div class="stores">
<input id="s0" value="ร้าน A" aria-label="ชื่อร้านที่ 1">
<input id="s1" value="ร้าน B" aria-label="ชื่อร้านที่ 2">
<input id="s2" value="ร้าน C" aria-label="ชื่อร้านที่ 3">
</div>
</div>

<h2 style="margin-left:4px">2. รายการวัสดุ</h2>
<div id="items"></div>
<button class="big" id="add">+ เพิ่มรายการ</button>

<h2 style="margin:18px 0 10px 4px">3. สรุป</h2>
<div class="card rank pad" id="sum"></div>
</main>

<script>
(function(){
  var blank = function(){ return {n:"",q:"",u:"",p:["","",""]}; };
  var rows = [
    {n:"ปูนซีเมนต์",q:100,u:"ถุง",p:[120,115,118]},
    {n:"ทราย",q:5,u:"คิว",p:[350,380,340]},
    blank()
  ];
  var box = document.getElementById("items");
  var fmt = function(x){ return x.toLocaleString("th-TH",{maximumFractionDigits:2}); };
  var num = function(v){ var x = parseFloat(v); return isNaN(x) ? null : x; };
  var esc = function(s){ return String(s).replace(/[&<>"]/g,function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]; }); };
  var names = function(){ return [0,1,2].map(function(i){ return document.getElementById("s"+i).value || "ร้าน "+"ABC"[i]; }); };

  function build(){
    box.innerHTML = "";
    rows.forEach(function(r,i){
      var d = document.createElement("div");
      d.className = "card";
      var lines = [0,1,2].map(function(k){
        return '<div class="line" id="l'+i+'_'+k+'"><span class="sn" data-sn="'+k+'"></span><span class="tag">ถูกสุด</span><input data-i="'+i+'" data-p="'+k+'" type="number" min="0" step="any" inputmode="decimal" placeholder="ราคา บาท"></div>';
      }).join("");
      d.innerHTML =
        '<div class="pad"><label class="lbl">ชื่อวัสดุ</label><input class="name" data-i="'+i+'" data-f="n" placeholder="เช่น ปูนซีเมนต์">'+
        '<div class="two"><div><label class="lbl">จำนวน</label><input data-i="'+i+'" data-f="q" type="number" min="0" inputmode="decimal" placeholder="0"></div>'+
        '<div><label class="lbl">หน่วย</label><input data-i="'+i+'" data-f="u" placeholder="ถุง / คิว"></div></div>'+
        lines+'</div>'+
        '<div class="foot"><span id="d'+i+'">ส่วนต่าง -</span><button data-del="'+i+'">ลบ</button></div>';
      box.appendChild(d);
      var ins = d.querySelectorAll("input");
      ins[0].value = r.n; ins[1].value = r.q; ins[2].value = r.u;
      for(var k=0;k<3;k++) ins[3+k].value = r.p[k];
    });
    calc();
  }

  function calc(){
    var nm = names();
    document.querySelectorAll("[data-sn]").forEach(function(e){ e.textContent = nm[e.dataset.sn]; });
    var totals=[0,0,0], miss=[0,0,0], mix=0, used=0, list="";
    rows.forEach(function(r,i){
      var ps = r.p.map(num), vals = ps.filter(function(x){ return x!==null; });
      var min = vals.length ? Math.min.apply(null,vals) : null;
      var max = vals.length ? Math.max.apply(null,vals) : null;
      for(var k=0;k<3;k++) document.getElementById("l"+i+"_"+k).classList.toggle("best", ps[k]!==null && vals.length>1 && ps[k]===min);
      document.getElementById("d"+i).textContent = vals.length>1 ? "ส่วนต่าง "+fmt(max-min)+" บาท" : "ส่วนต่าง -";
      var q = num(r.q);
      if(q!==null && q>0 && vals.length){
        used++; mix += min*q; var bi=ps.indexOf(min); list += '<div class="it"><div><b>'+esc(r.n||"(ยังไม่ใส่ชื่อ)")+'</b><small>'+fmt(q)+' '+esc(r.u)+'</small></div><div class="r"><span class="tag" style="display:inline-block">'+esc(nm[bi])+'</span><b>'+fmt(min)+'</b><small>รวม '+fmt(min*q)+' บาท</small></div></div>';
        for(var k2=0;k2<3;k2++){ if(ps[k2]===null) miss[k2]++; else totals[k2] += ps[k2]*q; }
      }
    });
    var el = document.getElementById("sum");
    if(!used){ el.innerHTML = '<span class="empty">ใส่จำนวนและราคา แล้วยอดรวมจะขึ้นที่นี่</span>'; return; }
    var ok = [0,1,2].filter(function(k){ return !miss[k]; });
    var low = ok.length ? Math.min.apply(null, ok.map(function(k){ return totals[k]; })) : null;
    var h = '<div class="lbl" style="margin:0 0 4px">รายการที่ควรสั่ง (ร้านที่ถูกสุด)</div>'+list+'<div class="lbl" style="margin:14px 0 4px">ถ้าซื้อทั้งหมดที่ร้านเดียว</div>';
    for(var k3=0;k3<3;k3++){
      h += '<div class="rk"><div>'+esc(nm[k3])+(miss[k3]?'<small>ขาดราคา '+miss[k3]+' รายการ</small>':(totals[k3]===low?'<small>ถูกสุดในกลุ่มร้านเดียว</small>':''))+'</div><b>'+fmt(totals[k3])+' บาท</b></div>';
    }
    h += '<div class="win"><small>ซื้อรายการละร้านที่ถูกสุด</small><b>'+fmt(mix)+' บาท</b></div>';
    if(low!==null) h += '<div class="win sav"><small>ประหยัดกว่าร้านเดียวที่ถูกสุด</small><b>'+fmt(low-mix)+' บาท</b></div>';
    el.innerHTML = h;
  }

  box.addEventListener("input",function(e){
    var t=e.target, i=t.dataset.i;
    if(i===undefined) return;
    if(t.dataset.p!==undefined) rows[i].p[t.dataset.p]=t.value; else rows[i][t.dataset.f]=t.value;
    calc();
  });
  box.addEventListener("click",function(e){
    var d=e.target.dataset.del;
    if(d===undefined) return;
    rows.splice(d,1);
    if(!rows.length) rows.push(blank());
    build();
  });
  [0,1,2].forEach(function(i){ document.getElementById("s"+i).addEventListener("input",calc); });
  document.getElementById("add").onclick=function(){ rows.push(blank()); build(); window.scrollBy(0,0); };
  document.getElementById("clear").onclick=function(){ rows=[blank()]; build(); };
  document.getElementById("print").onclick=function(){ window.print(); };
  build();
})();
</script>
</body>
</html>
